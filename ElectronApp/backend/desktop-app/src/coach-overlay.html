<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0D1224;
            --border: rgba(255,255,255,0.12);
            --text: rgba(255,255,255,0.94);
            --muted: rgba(255,255,255,0.5);
            --accent: #73B7FF;
            --accent2: #8F7DFF;
            --teal: #3EE6D8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: transparent;
            overflow: hidden;
            color: var(--text);
        }
        .panel {
            background: var(--bg);
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 12px 40px rgba(0,0,0,0.55), 0 0 0 1px rgba(115,183,255,0.1);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 12px;
            cursor: move;
            -webkit-app-region: drag;
            user-select: none;
            border-bottom: 1px solid rgba(255,255,255,0.07);
            flex-shrink: 0;
        }
        .dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--teal);
            box-shadow: 0 0 8px rgba(62,230,216,0.7);
            animation: pulse 1.6s ease-in-out infinite;
        }
        .title {
            font-size: 11px; font-weight: 800;
            letter-spacing: 0.09em; text-transform: uppercase;
            color: var(--muted);
            flex: 1;
        }
        .ctrl {
            -webkit-app-region: no-drag;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--muted);
            width: 20px; height: 20px;
            border-radius: 6px;
            font-size: 11px; line-height: 1;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.15s, color 0.15s;
        }
        .ctrl:hover { background: rgba(255,255,255,0.12); color: var(--text); }
        .cards {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .cards::-webkit-scrollbar { width: 0; }
        .empty {
            color: var(--muted);
            font-size: 12px;
            text-align: center;
            margin: auto;
            padding: 16px;
            line-height: 1.5;
        }
        .card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-left: 3px solid var(--accent);
            border-radius: 10px;
            padding: 9px 11px;
            animation: fadeIn 0.3s ease;
        }
        .card .meta {
            display: flex; align-items: center; gap: 6px;
            margin-bottom: 5px;
        }
        .badge {
            font-size: 9px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.06em;
            padding: 2px 6px; border-radius: 5px;
            background: rgba(115,183,255,0.16);
            color: var(--accent);
        }
        .badge.question  { background: rgba(143,125,255,0.18); color: var(--accent2); border-left-color: var(--accent2); }
        .badge.clarify   { background: rgba(62,230,216,0.16); color: var(--teal); }
        .badge.redirect  { background: rgba(255,176,99,0.18); color: #ffb063; }
        .conf {
            font-size: 9px; color: var(--muted);
            margin-left: auto; font-weight: 600;
        }
        .card .text {
            font-size: 12.5px; font-weight: 600;
            line-height: 1.4; color: var(--text);
        }
        .footer {
            padding: 8px 10px; border-top: 1px solid rgba(255,255,255,0.07); flex-shrink: 0;
            -webkit-app-region: no-drag; display: flex; gap: 8px;
        }
        .answer-btn, .insight-btn {
            flex: 1; padding: 9px; border-radius: 10px; cursor: pointer;
            border: none; font-weight: 800; font-size: 12.5px;
            transition: filter 0.15s, opacity 0.15s;
        }
        .answer-btn { background: linear-gradient(135deg, var(--teal), var(--accent)); color: #07101f; }
        .insight-btn { background: rgba(255,255,255,0.1); color: var(--text); border: 1px solid rgba(255,255,255,0.14); }
        .answer-btn:hover, .insight-btn:hover { filter: brightness(1.1); }
        .answer-btn:disabled, .insight-btn:disabled { opacity: 0.6; cursor: default; }
        .collapsed .cards, .collapsed .footer { display: none; }
        .collapsed { height: auto !important; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
    </style>
</head>
<body>
    <div class="panel" id="panel">
        <div class="header">
            <div class="dot"></div>
            <span class="title">Live Coach</span>
            <button class="ctrl" id="collapseBtn" title="Collapse">▾</button>
            <button class="ctrl" id="stopBtn" title="End live session">■</button>
        </div>
        <div class="cards" id="cards">
            <div class="empty" id="empty">Listening… click “Get Insight” whenever you want advice based on the conversation so far.</div>
        </div>
        <div class="footer">
            <button class="answer-btn" id="answerBtn" type="button">✦ Answer</button>
            <button class="insight-btn" id="insightBtn" type="button">✦ Insight</button>
        </div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');
        const MAX_CARDS = 4;

        const panel = document.getElementById('panel');
        const cards = document.getElementById('cards');
        const empty = document.getElementById('empty');

        const SAFE_TYPES = ['question', 'contribute', 'clarify', 'redirect'];

        function addSuggestion(s) {
            if (empty) empty.remove();

            const type = SAFE_TYPES.includes(s.suggestion_type) ? s.suggestion_type : 'contribute';
            const card = document.createElement('div');
            card.className = 'card';

            const meta = document.createElement('div');
            meta.className = 'meta';
            const badge = document.createElement('span');
            badge.className = 'badge ' + type;
            badge.textContent = type;
            const conf = document.createElement('span');
            conf.className = 'conf';
            conf.textContent = (s.confidence || 'medium') + ' confidence';
            meta.appendChild(badge);
            meta.appendChild(conf);

            const text = document.createElement('div');
            text.className = 'text';
            text.textContent = s.content || '';

            card.appendChild(meta);
            card.appendChild(text);
            cards.insertBefore(card, cards.firstChild);

            while (cards.children.length > MAX_CARDS) {
                cards.removeChild(cards.lastChild);
            }
        }

        const answerBtn = document.getElementById('answerBtn');
        const insightBtn = document.getElementById('insightBtn');

        function resetBtns() {
            answerBtn.disabled = false; answerBtn.textContent = '✦ Answer';
            insightBtn.disabled = false; insightBtn.textContent = '✦ Insight';
        }

        function addInsight(payload) {
            if (empty) empty.remove();
            const card = document.createElement('div');
            card.className = 'card';
            card.style.borderLeftColor = 'var(--muted)';
            const meta = document.createElement('div');
            meta.className = 'meta';
            const badge = document.createElement('span');
            badge.className = 'badge';
            badge.style.background = 'rgba(255,255,255,0.1)';
            badge.style.color = 'var(--muted)';
            badge.textContent = 'insight';
            meta.appendChild(badge);
            card.appendChild(meta);
            if (payload.summary) {
                const t = document.createElement('div');
                t.className = 'text'; t.textContent = payload.summary;
                card.appendChild(t);
            }
            if (payload.bullets && payload.bullets.length) {
                const ul = document.createElement('ul');
                ul.style.cssText = 'margin:6px 0 0 16px;font-size:11.5px;line-height:1.5;color:var(--text);';
                payload.bullets.forEach(b => { const li = document.createElement('li'); li.textContent = b; ul.appendChild(li); });
                card.appendChild(ul);
            }
            cards.insertBefore(card, cards.firstChild);
            while (cards.children.length > MAX_CARDS) cards.removeChild(cards.lastChild);
        }

        ipcRenderer.on('coach-suggestion', (_e, payload) => {
            if (payload && payload.content) addSuggestion(payload);
            resetBtns();
        });
        ipcRenderer.on('coach-insight', (_e, payload) => {
            if (payload) addInsight(payload);
            resetBtns();
        });
        ipcRenderer.on('coach-pending', () => { answerBtn.disabled = true; answerBtn.textContent = '✦ Answering…'; });
        ipcRenderer.on('coach-insight-pending', () => { insightBtn.disabled = true; insightBtn.textContent = '✦ Thinking…'; });

        answerBtn.addEventListener('click', async () => {
            answerBtn.disabled = true; answerBtn.textContent = '✦ Answering…';
            try { await ipcRenderer.invoke('request-answer-from-overlay'); }
            catch (err) { console.error('request-answer failed:', err); answerBtn.disabled = false; }
        });
        insightBtn.addEventListener('click', async () => {
            insightBtn.disabled = true; insightBtn.textContent = '✦ Thinking…';
            try { await ipcRenderer.invoke('request-insight-from-overlay'); }
            catch (err) { console.error('request-insight failed:', err); insightBtn.disabled = false; }
        });

        document.getElementById('collapseBtn').addEventListener('click', () => {
            panel.classList.toggle('collapsed');
            document.getElementById('collapseBtn').textContent =
                panel.classList.contains('collapsed') ? '▸' : '▾';
        });

        document.getElementById('stopBtn').addEventListener('click', async () => {
            try { await ipcRenderer.invoke('stop-live-from-overlay'); }
            catch (err) { console.error('stop-live-from-overlay failed:', err); }
        });
    </script>
</body>
</html>
