<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: transparent;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }
        
        .overlay {
            background: rgba(13, 18, 36, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.12);
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            font-weight: 600;
            color: rgba(255,255,255,0.92);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(115,183,255,0.12);
            cursor: move;
            -webkit-app-region: drag;
            user-select: none;
            width: 180px;
        }
        
        .waveform {
            display: flex;
            align-items: center;
            gap: 1.5px;
            height: 14px;
            margin: 0 2px;
        }
        
        .wave-bar {
            width: 2.5px;
            background: linear-gradient(180deg, #73B7FF, #8F7DFF);
            border-radius: 2px;
            transition: height 0.1s ease;
            opacity: 0.5;
        }
        
        .wave-bar.active {
            opacity: 1;
            background: linear-gradient(180deg, #3EE6D8, #73B7FF);
            box-shadow: 0 0 4px rgba(62,230,216,0.4);
        }
        
        .recording-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #73B7FF;
            box-shadow: 0 0 8px rgba(115,183,255,0.6);
            animation: pulse 1.5s ease-in-out infinite;
            flex-shrink: 0;
        }

        .rec-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.55);
        }
        
        .recording-time {
            font-family: 'Plus Jakarta Sans', 'SF Mono', monospace;
            font-variant-numeric: tabular-nums;
            font-weight: 700;
            font-size: 12px;
            color: rgba(255,255,255,0.92);
            letter-spacing: -0.02em;
        }
        
        .stop-btn {
            background: rgba(239,68,68,0.15);
            border: 1px solid rgba(239,68,68,0.3);
            color: #ff6b6b;
            font-size: 8px;
            cursor: pointer;
            padding: 3px 5px;
            border-radius: 6px;
            opacity: 0.8;
            transition: opacity 0.2s ease, background 0.2s;
            -webkit-app-region: no-drag;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .stop-btn:hover {
            opacity: 1;
            background: rgba(239,68,68,0.3);
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }
    </style>
</head>
<body>
    <div class="overlay">
        <div class="recording-dot"></div>
        <span class="rec-label">REC</span>
        <div class="waveform" id="waveform">
            <div class="wave-bar" style="height: 2px;"></div>
            <div class="wave-bar" style="height: 4px;"></div>
            <div class="wave-bar" style="height: 3px;"></div>
            <div class="wave-bar" style="height: 6px;"></div>
            <div class="wave-bar" style="height: 2px;"></div>
            <div class="wave-bar" style="height: 5px;"></div>
            <div class="wave-bar" style="height: 3px;"></div>
            <div class="wave-bar" style="height: 4px;"></div>
        </div>
        <span class="recording-time" id="time">00:00</span>
        <button class="stop-btn" id="stopBtn" title="Stop Recording">■</button>
    </div>

    <script>
        const { ipcRenderer } = require('electron');
        
        let waveformBars = [];
        
        // Initialize waveform bars
        document.addEventListener('DOMContentLoaded', () => {
            waveformBars = Array.from(document.querySelectorAll('.wave-bar'));
            // Set all bars to minimum height initially
            waveformBars.forEach(bar => {
                bar.style.height = '2px';
                bar.classList.remove('active');
            });
        });
        
        // Reset waveform to quiet state
        function resetWaveform() {
            waveformBars.forEach(bar => {
                bar.style.height = '2px';
                bar.classList.remove('active');
            });
        }
        
        // Update time when received from main process
        ipcRenderer.on('update-time', (event, time) => {
            document.getElementById('time').textContent = time;
        });
        
        // Listen for audio level updates from main process
        ipcRenderer.on('update-audio-level', (event, level) => {
            const normalizedLevel = Math.max(0, Math.min(1, level));
            
            waveformBars.forEach((bar, index) => {
                const barActivity = normalizedLevel * (0.5 + Math.random() * 0.5);
                const height = 2 + (barActivity * 10);
                bar.style.height = `${height}px`;
                
                if (barActivity > 0.4) {
                    bar.classList.add('active');
                } else {
                    bar.classList.remove('active');
                }
            });
        });
        
        // Handle stop button click
        document.getElementById('stopBtn').addEventListener('click', async () => {
            resetWaveform();
            try {
                await ipcRenderer.invoke('stop-recording-from-overlay');
            } catch (error) {
                console.error('Error stopping recording from overlay:', error);
            }
        });
    </script>
</body>
</html>
